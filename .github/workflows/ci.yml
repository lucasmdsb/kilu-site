# Validação em todo PR (specs/features/infrastructure.md RF08). A publicação é feita pelo
# App Platform, que reconstrói o site estático a cada push na main (deploy/app.yaml no backend).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Varredura de segredos (CA04)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --no-banner

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - name: E2E com acessibilidade
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: "true"
